# =============================================================================
# Real Pterodactyl stack for GitHub Codespaces.
# Brings up the SAME official images used in production:
#   - ghcr.io/pterodactyl/panel  (nginx + PHP-FPM, auto migration on boot)
#   - mariadb, redis, ghcr.io/pterodactyl/wings (privileged, docker.sock)
# Variables come from .codespace/.env written by scripts/codespace-up.sh.
# This is NOT the browser mock - it is the genuine Pterodactyl application.
# =============================================================================
services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    # MariaDB already defaults to the mysql_native_password plugin that
    # Pterodactyl expects; no command-line overrides (unknown flags made
    # older/newer image revisions exit immediately and report unhealthy).
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${PTERO_DATA_DIR}/database:/var/lib/mysql
    healthcheck:
      # mariadb-admin exists in every official MariaDB image and returns
      # success as soon as the server accepts connections.
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  cache:
    image: redis:7-alpine
    restart: unless-stopped

  panel:
    image: ${PANEL_IMAGE}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      # Codespace forwards this as https://${CODESPACE_NAME}-8080.${DOMAIN}
      - "8080:80"
    environment:
      APP_URL: ${PANEL_PUBLIC_URL}
      APP_TIMEZONE: UTC
      APP_SERVICE_AUTHOR: ${ADMIN_EMAIL}
      DB_HOST: database
      DB_PORT: "3306"
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
      MAIL_FROM: noreply@example.com
      MAIL_DRIVER: log
    volumes:
      - ${PTERO_DATA_DIR}/panel/var:/app/var
      - ${PTERO_DATA_DIR}/panel/logs:/app/storage/logs

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    restart: unless-stopped
    depends_on:
      - panel
    privileged: true
    ports:
      # 8081 (host) -> 8080 (container): Wings API/websocket via the proxy
      - "8081:8080"
      - "2022:2022"
      - "25565:25565"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${PTERO_DATA_DIR}/wings/config:/etc/pterodactyl
      - ${PTERO_DATA_DIR}/wings/data:/var/lib/pterodactyl
      - ${PTERO_DATA_DIR}/wings/logs:/var/log/pterodactyl
      - ${PTERO_DATA_DIR}/wings/tmp:/tmp/pterodactyl
      - /etc/ssl/certs:/etc/ssl/certs:ro
